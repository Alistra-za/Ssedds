[package]
name = "sdc-gui"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
# eframe 0.36.2's floor.
rust-version = "1.95"

[lib]
name = "sdc_gui"
path = "src/lib.rs"

[[bin]]
name = "tessalith"
path = "src/main.rs"

[dependencies]
engine.workspace = true
encoders-sys.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
half.workspace = true
# Default features minus default_fonts (system fonts are loaded at run time, see fonts.rs). wgpu is used only through eframe::egui_wgpu::wgpu.
eframe = { version = "=0.36.2", default-features = false, features = ["accesskit", "links", "wgpu"] }
rfd = "=0.17.2"
toml_edit = "0.25"
sha2.workspace = true
hex.workspace = true
modscan = { path = "../modscan" }
nif = { path = "../nif" }
render3d = { path = "../render3d" }
vfs = { path = "../vfs" }
pgpsim = { path = "../pgpsim" }
rusqlite.workspace = true
# F3b: find/replace patterns in the rename dialog (linear time, no look-around).
regex = "1"

# The monitor rectangles at start (layout.rs, AG18). 0.61.2 is the version eframe's winit already uses.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_HiDpi"] }

[dev-dependencies]
egui_kittest = "=0.36.2"
tempfile.workspace = true
image.workspace = true
walkdir.workspace = true
crc32fast.workspace = true
