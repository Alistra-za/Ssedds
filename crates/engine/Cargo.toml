[package]
name = "engine"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true
build = "build.rs"

[dependencies]
encoders-sys.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
schemars.workspace = true
thiserror.workspace = true
image.workspace = true
half.workspace = true
bcdec_rs.workspace = true
rayon.workspace = true
sha2.workspace = true
hex.workspace = true
globset.workspace = true
walkdir.workspace = true
humantime.workspace = true

[features]
# Env-driven test hooks (SDC_TEST_PANIC_ON, SDC_TEST_FAIL_VALIDATION). Off by default and never enabled by a
# release build; the dev-dependency below turns it on for `cargo test` (resolver 2 keeps dev-dependency
# features out of `cargo build`). DECISIONS Note K.
test-hooks = []

[dev-dependencies]
tempfile.workspace = true
engine = { path = ".", features = ["test-hooks"] }
