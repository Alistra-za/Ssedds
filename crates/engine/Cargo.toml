[package]
name = "engine"
version.workspace = true
edition.workspace = true
license = "MPL-2.0"
publish.workspace = true
rust-version.workspace = true
build = "build.rs"

[dependencies]
encoders-sys.workspace = true
serde.workspace = true
# float_roundtrip: a cached Analysis must read back bit for bit (Note DZ).
serde_json = { workspace = true, features = ["float_roundtrip"] }
toml.workspace = true
toml_edit = "0.25"
schemars.workspace = true
thiserror.workspace = true
image.workspace = true
half.workspace = true
bcdec_rs.workspace = true
rayon.workspace = true
sha2.workspace = true
hex.workspace = true
globset.workspace = true
walkdir.workspace = true
humantime.workspace = true
flate2.workspace = true

[features]
# Env-driven test hooks (SDC_TEST_PANIC_ON, SDC_TEST_PANIC_ON_PLAN, SDC_TEST_FAIL_VALIDATION, SDC_TEST_CANCEL_ON, SDC_TEST_ENCODE_INPUT_DIR). Off by default and never enabled by a
# release build; the dev-dependency below turns it on for `cargo test` (resolver 2 keeps dev-dependency
# features out of `cargo build`). DECISIONS Note K.
test-hooks = []

# Test-only stand-in for NVIDIA's nvcompress (DECISIONS Note NV); built only with test-hooks, so never shipped.
[[bin]]
name = "nvcompress"
path = "src/bin/nvcompress.rs"
required-features = ["test-hooks"]

[dev-dependencies]
tempfile.workspace = true
engine = { path = ".", features = ["test-hooks"] }
