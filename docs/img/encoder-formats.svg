<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 546" width="780" height="546" role="img" aria-labelledby="t d">
<title id="t">Encoders compared by format, PSNR</title>
<desc id="d">Bar chart of PSNR in dB, grouped by compressor, one bar per format (BC1 RGB, BC3 premultiplied, BC4, BC6H multi-exposure), with the format shown by a stripe pattern. rgbcx is best on BC1 (39.85) and BC4 (45.59), and within 0.09 dB of NVTT 3 on BC3 (49.20 against 49.29). Intel ISPC is best on BC6H (50.38). rgbcx and Compressonator BC6H values were not measured. texconv CPU is last or near last.</desc>
<style>
svg{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
--ink:#1f2328;--mute:#59636e;--grid:#d1d9e0;--bg:#ffffff;--c0:#2a78d6;--c1:#eb6834;--c2:#1baf7a;--c3:#6250d6;--c4:#e87ba4;}
@media (prefers-color-scheme: dark){svg{--ink:#e6edf3;--mute:#9198a1;--grid:#30363d;--bg:#0d1117;--c0:#3987e5;--c1:#d95926;--c2:#199e70;--c3:#9085e9;--c4:#d55181;}}
.bg{fill:var(--bg)}
text{fill:var(--ink);font-size:12px;paint-order:stroke;stroke:var(--bg);stroke-width:4px;stroke-linejoin:round}
.m{fill:var(--mute)}
.b{font-weight:600}
.t{font-size:14px;font-weight:600}
.s{font-size:11px;fill:var(--mute)}
.g{stroke:var(--grid);stroke-width:1;fill:none}
.z{stroke:var(--mute);stroke-width:1;fill:none}
.lt{opacity:.5}
.mu{fill:var(--mute)}
.pl{fill:var(--bg)}
.f0{fill:var(--c0)}.f1{fill:var(--c1)}.f2{fill:var(--c2)}.f3{fill:var(--c3)}.f4{fill:var(--c4)}</style>
<rect class="bg" width="780" height="546"/>
<defs><pattern id="pd" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="2.5" height="6" class="pl"/></pattern><pattern id="ph" width="6" height="5" patternUnits="userSpaceOnUse"><rect width="6" height="2" class="pl"/></pattern><pattern id="px" width="6" height="6" patternUnits="userSpaceOnUse"><rect width="6" height="1.6" class="pl"/><rect width="1.6" height="6" class="pl"/></pattern></defs>
<text x="10.0" y="20.0" class="t" text-anchor="start">Best encoder per format: PSNR in dB, grouped by compressor</text>
<text x="10.0" y="38.0" class="s" text-anchor="start">Higher is better. Bars start at 35 dB, not zero. The stripe shows the format.</text>
<rect x="10" y="48" width="14" height="12" class="mu"/>
<text x="30.0" y="58.0" class="s" text-anchor="start">BC1 RGB</text>
<rect x="97" y="48" width="14" height="12" class="mu"/>
<rect x="97" y="48" width="14" height="12" fill="url(#pd)"/>
<text x="117.0" y="58.0" class="s" text-anchor="start">BC3 premultiplied</text>
<rect x="254" y="48" width="14" height="12" class="mu"/>
<rect x="254" y="48" width="14" height="12" fill="url(#ph)"/>
<text x="274.0" y="58.0" class="s" text-anchor="start">BC4</text>
<rect x="313" y="48" width="14" height="12" class="mu"/>
<rect x="313" y="48" width="14" height="12" fill="url(#px)"/>
<text x="333.0" y="58.0" class="s" text-anchor="start">BC6H multi-exposure</text>
