<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 646" width="780" height="646" role="img" aria-labelledby="t d">
<title id="t">Encoders compared by format, PSNR</title>
<desc id="d">Grouped horizontal bars of PSNR in dB for BC1, BC3, BC4 and BC6H, one bar per encoder. rgbcx is best on BC1 (39.85) and BC4 (45.59), and within 0.09 dB of NVTT 3 on BC3 (49.20 against 49.29). Intel ISPC is best on BC6H (50.38). rgbcx and Compressonator BC6H values were not measured. texconv CPU is last or near last.</desc>
<style>
svg{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
--ink:#1f2328;--mute:#59636e;--grid:#d1d9e0;--bg:#ffffff;--c0:#2a78d6;--c1:#eb6834;--c2:#1baf7a;--c3:#6250d6;--c4:#e87ba4;}
@media (prefers-color-scheme: dark){svg{--ink:#e6edf3;--mute:#9198a1;--grid:#30363d;--bg:#0d1117;--c0:#3987e5;--c1:#d95926;--c2:#199e70;--c3:#9085e9;--c4:#d55181;}}
.bg{fill:var(--bg)}
text{fill:var(--ink);font-size:12px;paint-order:stroke;stroke:var(--bg);stroke-width:4px;stroke-linejoin:round}
.m{fill:var(--mute)}
.b{font-weight:600}
.t{font-size:14px;font-weight:600}
.s{font-size:11px;fill:var(--mute)}
.g{stroke:var(--grid);stroke-width:1;fill:none}
.z{stroke:var(--mute);stroke-width:1;fill:none}
.lt{opacity:.5}
.mu{fill:var(--mute)}
.f0{fill:var(--c0)}.f1{fill:var(--c1)}.f2{fill:var(--c2)}.f3{fill:var(--c3)}.f4{fill:var(--c4)}</style>
<rect class="bg" width="780" height="646"/>
<text x="10.0" y="20.0" class="t" text-anchor="start">Best encoder per format, PSNR in dB</text>
<text x="10.0" y="38.0" class="s" text-anchor="start">Higher is better. Bars start at 35 dB, not zero.</text>
<text x="10.0" y="66.0" class="b" text-anchor="start">BC1 colour (RGB PSNR)</text>
