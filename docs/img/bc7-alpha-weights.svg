<rect x="235.0" y="1039.0" width="382.3" height="10" class="f1"/>
<text x="622.3" y="1048.0" class="s" text-anchor="start">57.31</text>
<text x="10.0" y="1075.0" class="" text-anchor="start">w64 (study only)</text>
<rect x="235.0" y="1061.0" width="178.8" height="10" class="f0"/>
<text x="418.8" y="1070.0" class="s" text-anchor="start">42.77</text>
<rect x="235.0" y="1073.0" width="399.1" height="10" class="f1"/>
<text x="639.1" y="1082.0" class="s" text-anchor="start">58.51</text>
<text x="10.0" y="1123.0" class="s" text-anchor="start">Why BC3 leads on specular here: BC3 gives alpha its own half of the block (two 8-bit ends, 8 levels per block).</text>
<text x="10.0" y="1138.0" class="s" text-anchor="start">BC7 shares one block across RGBA: its alpha either shares the colour indices (mode 6) or gets 4 levels (mode 5).</text>
<text x="10.0" y="1153.0" class="s" text-anchor="start">These RGB channels are three unrelated maps (roughness, metal, AO), so colour needs most of BC7's bits, while the specular</text>
<text x="10.0" y="1168.0" class="s" text-anchor="start">is smooth and near 255. BC3 keeps 91% of specular-255 texels exact against BC7's 65 to 74%, and pays 4 to 7 dB of RGB for it.</text>
<text x="10.0" y="1189.0" class="s" text-anchor="start">Local study, 2026-10-21 and 2026-10-22 (DECISIONS Note CP). Alpha ×8 is the BC3 replacement the study found for smooth alpha.</text>
<text x="10.0" y="1204.0" class="s" text-anchor="start">No weight up to ×64 beats BC3 on alpha on every texture in any class; every doubling costs 0.25 to 0.55 dB RGB.</text>
</svg>
