<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 1218" width="780" height="1218" role="img" aria-labelledby="t d">
<title id="t">BC3 against BC7 alpha weights</title>
<desc id="d">Grouped bars of mean RGB and alpha PSNR for BC3 and BC7 with alpha weights 1 to 64, in three texture classes. On colour with smooth alpha, Alpha x8 gives 51.40 dB alpha against 47.24 for BC3 and keeps 46.60 dB RGB against 41.00. On a normal map with specular, w64 passes BC3 on alpha (46.64 against 46.06) but its normals fall behind. On packed rmaos with specular, BC3 keeps the highest alpha, 58.98 dB against 58.51 at w64, because BC3 gives alpha its own half of the block.</desc>
