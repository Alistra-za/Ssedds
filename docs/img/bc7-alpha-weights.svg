<text x="10.0" y="768.0" class="s" text-anchor="start">At w64 BC7 passes BC3 on mean specular, but its normals are now worse than BC3's (2.85° against 2.81° mean error).</text>
<text x="10.0" y="807.0" class="t" text-anchor="start">Packed rmaos with specular in alpha</text>
<text x="273.5" y="807.0" class="s" text-anchor="start">rmaos_spec, 24 textures</text>
