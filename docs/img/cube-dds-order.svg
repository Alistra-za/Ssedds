<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 150" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#222">
  <title>Byte order inside a cube DDS: header, then each face with its whole mip chain</title>
  <rect width="700" height="150" rx="10" fill="#ffffff"/>
  <text x="350" y="26" text-anchor="middle" font-weight="600" font-size="14">Inside the .dds file, start to end</text>
  <rect x="20" y="45" width="70" height="56" fill="#e3e6ea" stroke="#888"/>
  <text x="55" y="70" text-anchor="middle">header</text>
  <text x="55" y="86" text-anchor="middle" font-size="10" fill="#555">cube flags</text>
  <g font-size="11">
    <rect x="94" y="45" width="96" height="56" fill="#f6c9c9" stroke="#b83232"/>
    <text x="142" y="68" text-anchor="middle" font-weight="700" font-size="14" fill="#b83232">+X</text>
    <text x="142" y="88" text-anchor="middle">mip 0, 1, … 1×1</text>
    <rect x="194" y="45" width="96" height="56" fill="#c4ecf1" stroke="#127f8c"/>
    <text x="242" y="68" text-anchor="middle" font-weight="700" font-size="14" fill="#127f8c">−X</text>
    <text x="242" y="88" text-anchor="middle">mip 0, 1, … 1×1</text>
    <rect x="294" y="45" width="96" height="56" fill="#cfeccf" stroke="#2e7d2e"/>
    <text x="342" y="68" text-anchor="middle" font-weight="700" font-size="14" fill="#2e7d2e">+Y</text>
    <text x="342" y="88" text-anchor="middle">mip 0, 1, … 1×1</text>
    <rect x="394" y="45" width="96" height="56" fill="#efcdef" stroke="#a03aa0"/>
    <text x="442" y="68" text-anchor="middle" font-weight="700" font-size="14" fill="#a03aa0">−Y</text>
    <text x="442" y="88" text-anchor="middle">mip 0, 1, … 1×1</text>
    <rect x="494" y="45" width="96" height="56" fill="#cfdbf7" stroke="#2c56b0"/>
    <text x="542" y="68" text-anchor="middle" font-weight="700" font-size="14" fill="#2c56b0">+Z</text>
    <text x="542" y="88" text-anchor="middle">mip 0, 1, … 1×1</text>
    <rect x="594" y="45" width="96" height="56" fill="#f3e6b8" stroke="#98780f"/>
    <text x="642" y="68" text-anchor="middle" font-weight="700" font-size="14" fill="#98780f">−Z</text>
    <text x="642" y="88" text-anchor="middle">mip 0, 1, … 1×1</text>
  </g>
  <text x="350" y="130" text-anchor="middle" fill="#555">Face 0 to 5. Each face carries its whole mip chain before the next face starts.</text>
</svg>
