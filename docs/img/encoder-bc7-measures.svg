<text x="10.0" y="798.0" class="s" text-anchor="start">† Compressonator q1.0 was not re-measured on the wider set: its values come from the original 4–7 images.</text>
<text x="10.0" y="814.0" class="s" text-anchor="start">  There it was 0.15 dB behind NVTT on packed data and 0.27° behind on normals. The alpha-254 and time rows are also from the original run.</text>
<text x="10.0" y="830.0" class="s" text-anchor="start">* The opt-in mode 6 p-bit override (exact opaque alpha) is for when this is not acceptable.</text>
