<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 846" width="780" height="846" role="img" aria-labelledby="t d">
<title id="t">BC7 encoders compared by measure</title>
<desc id="d">BC7 encoders at maximum settings, one panel per measure. bc7e u5 matches the best quality on real colour and decals and takes 0.22 s per megapixel. NVTT 3 Production and Compressonator score higher on synthetic smooth gradients, but take about 14 and 33 s per megapixel. texconv CPU is last on every quality measure. bc7e u5 turns 28 percent of opaque input into alpha 254, against 0 percent for NVTT. Compressonator packed-data and normal-map values were not measured.</desc>
<style>
svg{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
--ink:#1f2328;--mute:#59636e;--grid:#d1d9e0;--bg:#ffffff;--c0:#2a78d6;--c1:#eb6834;--c2:#1baf7a;--c3:#6250d6;--c4:#e87ba4;}
@media (prefers-color-scheme: dark){svg{--ink:#e6edf3;--mute:#9198a1;--grid:#30363d;--bg:#0d1117;--c0:#3987e5;--c1:#d95926;--c2:#199e70;--c3:#9085e9;--c4:#d55181;}}
.bg{fill:var(--bg)}
text{fill:var(--ink);font-size:12px;paint-order:stroke;stroke:var(--bg);stroke-width:4px;stroke-linejoin:round}
.m{fill:var(--mute)}
.t{font-size:14px;font-weight:600}
.s{font-size:11px;fill:var(--mute)}
.g{stroke:var(--grid);stroke-width:1;fill:none}
.z{stroke:var(--mute);stroke-width:1;fill:none}
.ring{stroke:var(--bg);stroke-width:2}
.f0{fill:var(--c0)}.k0{stroke:var(--c0);fill:none}.f1{fill:var(--c1)}.k1{stroke:var(--c1);fill:none}.f2{fill:var(--c2)}.k2{stroke:var(--c2);fill:none}.f3{fill:var(--c3)}.k3{stroke:var(--c3);fill:none}.f4{fill:var(--c4)}.k4{stroke:var(--c4);fill:none}</style>
