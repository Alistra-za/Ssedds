<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 346" width="780" height="346" role="img" aria-labelledby="t d">
<title id="t">SSIM and VIF of BC7 encoders against bc7e u6</title>
<desc id="d">Two bar charts of the mean SSIM and VIF difference against bc7e u6 on 99 real colour textures. bc7e perceptual is the only encoder above zero, at plus 1.63 SSIM and plus 3.10 VIF. bc7e u5, Compressonator, NVTT Production, ISPC and bc7e u4 are slightly below u6, and the GPU encoders and texconv are furthest below, down to minus 2.40 VIF for texconv GPU.</desc>
<style>
svg{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
--ink:#1f2328;--mute:#59636e;--grid:#d1d9e0;--bg:#ffffff;--c0:#2a78d6;--c1:#eb6834;--c2:#1baf7a;--c3:#6250d6;--c4:#e87ba4;}
@media (prefers-color-scheme: dark){svg{--ink:#e6edf3;--mute:#9198a1;--grid:#30363d;--bg:#0d1117;--c0:#3987e5;--c1:#d95926;--c2:#199e70;--c3:#9085e9;--c4:#d55181;}}
.bg{fill:var(--bg)}
text{fill:var(--ink);font-size:12px;paint-order:stroke;stroke:var(--bg);stroke-width:4px;stroke-linejoin:round}
.m{fill:var(--mute)}
.b{font-weight:600}
.t{font-size:14px;font-weight:600}
.s{font-size:11px;fill:var(--mute)}
.g{stroke:var(--grid);stroke-width:1;fill:none}
.z{stroke:var(--mute);stroke-width:1;fill:none}
.lt{opacity:.5}
.mu{fill:var(--mute)}
.pl{fill:var(--bg)}
.nf{fill:var(--mute)}
.df{fill:none;stroke:var(--ink);stroke-width:2}
.f0{fill:var(--c0)}.f1{fill:var(--c1)}.f2{fill:var(--c2)}.f3{fill:var(--c3)}.f4{fill:var(--c4)}</style>
<rect class="bg" width="780" height="346"/>
<text x="10.0" y="20.0" class="t" text-anchor="start">BC7 opaque colour: SSIM and VIF against bc7e u6</text>
<text x="10.0" y="38.0" class="s" text-anchor="start">Mean difference over 99 images, on luma. Higher is better; 0 is bc7e u6.</text>
<text x="180.0" y="66.0" class="b" text-anchor="start">ΔSSIM × 10³</text>
<text x="520.0" y="66.0" class="b" text-anchor="start">ΔVIF × 10²</text>
<path class="g" d="M237.7 76.0V296.0"/>
<text x="237.7" y="311.0" class="m" text-anchor="middle">−1</text>
<path class="g" d="M301.8 76.0V296.0"/>
<text x="301.8" y="311.0" class="m" text-anchor="middle">0</text>
<path class="g" d="M365.9 76.0V296.0"/>
<text x="365.9" y="311.0" class="m" text-anchor="middle">1</text>
