<text x="10.0" y="91.0" class="" text-anchor="start">bc7e u6 perceptual</text>
<rect x="301.8" y="80.0" width="104.5" height="14" class="f0"/>
<text x="411.3" y="93.0" class="" text-anchor="start">+1.63</text>
<text x="10.0" y="113.0" class="b" text-anchor="start">bc7e u5</text>
