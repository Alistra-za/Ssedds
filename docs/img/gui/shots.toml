[[exempt]]
what = "3D set preview content"
page = "GUI-Set-Preview-3D"
reason = "needs Community Shaders' shader files (SDC_CS_SHADERS) and a D3D11 device"

[[exempt]]
what = "Complex grass and PBR grass sets"
page = "GUI-Set-Materials"
reason = "need GRAS records from a real plugin scan"

[[exempt]]
what = "Files tab during an export"
page = "GUI-Review-and-Export"
reason = "its rows hold timings and the export folder, so no two renders match; a shot would also write an export"

[[exempt]]
what = "Toasts"
page = "GUI-Bottom-Tabs"
reason = "a toast rises and fades on a clock, so no two renders match"

[[exempt]]
what = "Editing a NIF (edit panel, shapes, animation)"
page = "GUI-NIF-Edit"
reason = "the edit panel opens only on a mesh of a scanned MO2 instance, and its 3D view needs a D3D11 device"
