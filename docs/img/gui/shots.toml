# Documentation screenshots (docs/DOCUMENTATION.md §5). Rendered by crates/gui/tests/doc_shots.rs, refreshed with tools\doc-shots.ps1.

[render]
size = [1600, 900]
pixels_per_point = 1.0
theme = "dark"
# The wgpu adapter and the font files (sha256 of %WINDIR%\Fonts\<file>) the committed shots were made with.
# summary.md warns when a render differs: such shots are not comparable.
adapter = "Microsoft Basic Render Driver"

[render.fonts]
