<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 360" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#222">
  <title>Equirectangular panorama: how its rows and columns map to directions</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3f6fb8"/><stop offset="1" stop-color="#bcd6f2"/></linearGradient>
    <linearGradient id="gnd" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8fa86a"/><stop offset="1" stop-color="#5a4a32"/></linearGradient>
  </defs>
  <rect width="700" height="360" rx="10" fill="#ffffff"/>
  <text x="290" y="26" text-anchor="middle" font-weight="600" font-size="14">Panorama (equirect, width = 2 × height)</text>
  <g transform="translate(50,40)">
    <rect width="480" height="120" fill="url(#sky)"/>
    <rect y="120" width="480" height="120" fill="url(#gnd)"/>
    <path d="M0,120 L40,98 L80,112 L130,86 L170,108 L220,95 L260,118 L300,90 L350,104 L400,84 L440,110 L480,98 L480,120 Z" fill="#6c7f8f"/>
    <circle cx="300" cy="62" r="14" fill="#fff6c8"/>
    <line x1="0" y1="120" x2="480" y2="120" stroke="#fff" stroke-dasharray="6 4"/>
    <line x1="240" y1="0" x2="240" y2="240" stroke="#fff" stroke-dasharray="3 4" opacity="0.8"/>
    <rect width="480" height="240" fill="none" stroke="#333"/>
  </g>
  <g font-size="12">
    <text x="540" y="48">top row → straight up</text>
    <text x="540" y="64" fill="#555">(the whole row is one point)</text>
    <text x="540" y="164">middle row → horizon</text>
    <text x="540" y="278">bottom row → straight down</text>
    <text x="290" y="298" text-anchor="middle">↑ centre column → east (+X) at yaw 0</text>
    <text x="50" y="298">↑ left edge</text>
    <text x="530" y="298" text-anchor="end">right edge ↑</text>
    <text x="290" y="318" text-anchor="middle" fill="#555">The left and right edges are the same direction: the picture wraps around you.</text>
    <text x="290" y="338" text-anchor="middle" fill="#555">cubemap.yaw turns it; cubemap.mirror swaps east and west.</text>
  </g>
</svg>
