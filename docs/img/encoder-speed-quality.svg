<circle cx="361.3" cy="404.9" r="5" class="f0 ring"/>
<text x="371.3" y="408.9" class="" text-anchor="start">bc7e max‡ +0.32</text>
<circle cx="301.9" cy="486.9" r="5" class="f1 ring"/>
<text x="311.9" y="490.9" class="" text-anchor="start">ISPC slow −0.67</text>
<circle cx="631.0" cy="462.1" r="5" class="f2 ring"/>
<text x="631.0" y="482.1" class="" text-anchor="middle">NVTT Production/Highest −0.37</text>
<path d="M642.4 630.3H661.5" class="k4" stroke-width="10" stroke-linecap="round"/>
<text x="661.5" y="616.3" class="" text-anchor="middle">texconv CPU (-bc x) −2.4</text>
