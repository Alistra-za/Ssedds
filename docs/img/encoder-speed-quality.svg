<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 772" width="780" height="772" role="img" aria-labelledby="t d">
<title id="t">BC7 encoders: speed against quality</title>
<desc id="d">Scatter of BC7 encoders, speed against quality. The bc7e encoder is on the fast, high-quality side: bc7e u5 and u6 take about 0.2 to 0.3 s per megapixel and set the reference. Slow encoders (NVTT Production about 14, texconv CPU 16 to 20, Compressonator about 33) are no better than bc7e u6 on real colour or alpha. GPU encoders are fastest but lose 1.4 to 2.8 dB.</desc>
<style>
svg{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
--ink:#1f2328;--mute:#59636e;--grid:#d1d9e0;--bg:#ffffff;--c0:#2a78d6;--c1:#eb6834;--c2:#1baf7a;--c3:#6250d6;--c4:#e87ba4;}
@media (prefers-color-scheme: dark){svg{--ink:#e6edf3;--mute:#9198a1;--grid:#30363d;--bg:#0d1117;--c0:#3987e5;--c1:#d95926;--c2:#199e70;--c3:#9085e9;--c4:#d55181;}}
.bg{fill:var(--bg)}
text{fill:var(--ink);font-size:12px;paint-order:stroke;stroke:var(--bg);stroke-width:4px;stroke-linejoin:round}
.m{fill:var(--mute)}
.t{font-size:14px;font-weight:600}
.s{font-size:11px;fill:var(--mute)}
.g{stroke:var(--grid);stroke-width:1;fill:none}
.z{stroke:var(--mute);stroke-width:1;fill:none}
.ring{stroke:var(--bg);stroke-width:2}
.f0{fill:var(--c0)}.k0{stroke:var(--c0);fill:none}.f1{fill:var(--c1)}.k1{stroke:var(--c1);fill:none}.f2{fill:var(--c2)}.k2{stroke:var(--c2);fill:none}.f3{fill:var(--c3)}.k3{stroke:var(--c3);fill:none}.f4{fill:var(--c4)}.k4{stroke:var(--c4);fill:none}</style>
<rect class="bg" width="780" height="772"/>
<text x="10.0" y="14.0" class="t" text-anchor="start">BC7: colour (RGB, real textures)</text>
<text x="10.0" y="30.0" class="s" text-anchor="start">Δ vs bc7e u6 in dB (higher is better). Further right = slower.</text>
<path class="g" d="M70 330.0H740"/>
<text x="62.0" y="334.0" class="m" text-anchor="end">−3</text>
<path class="g" d="M70 247.1H740"/>
