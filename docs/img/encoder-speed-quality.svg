<circle cx="704.4" cy="94.7" r="5" class="f3 ring"/>
<text x="710.4" y="82.7" class="" text-anchor="end">Compressonator q1.0 −0.16</text>
<text x="10.0" y="364.0" class="t" text-anchor="start">BC7: real alpha</text>
<text x="10.0" y="380.0" class="s" text-anchor="start">Δ vs bc7e u6 in dB (higher is better). Further right = slower.</text>
<path class="g" d="M70 680.0H740"/>
<text x="62.0" y="684.0" class="m" text-anchor="end">−3</text>
