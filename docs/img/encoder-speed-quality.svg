<circle cx="223.4" cy="461.3" r="5" class="f0 ring"/>
<text x="214.4" y="465.3" class="" text-anchor="end">bc7e u4 −0.36</text>
<circle cx="275.3" cy="433.9" r="5" class="f0 ring"/>
