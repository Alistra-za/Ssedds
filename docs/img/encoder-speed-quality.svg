<path d="M104.7 493.6H198.8" class="k2" stroke-width="10" stroke-linecap="round"/>
<text x="99.7" y="515.6" class="" text-anchor="start">NVTT Normal (GPU) −0.75</text>
<path d="M104.7 663.4H198.8" class="k4" stroke-width="10" stroke-linecap="round"/>
<text x="212.8" y="667.4" class="" text-anchor="start">texconv GPU −2.8</text>
