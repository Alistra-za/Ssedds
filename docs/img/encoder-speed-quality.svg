<text x="696.3" y="346.0" class="m" text-anchor="middle">30</text>
<path d="M104.7 197.4H198.8" class="k2" stroke-width="10" stroke-linecap="round"/>
<text x="212.8" y="201.4" class="" text-anchor="start">NVTT Normal (GPU) −1.4</text>
