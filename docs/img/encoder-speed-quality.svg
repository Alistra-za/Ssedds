<text x="405.0" y="716.0" class="m" text-anchor="middle">Time per megapixel in seconds (log scale)</text>
<text x="10.0" y="742.0" class="s" text-anchor="start">‡ bc7e max is opt-in (encoder.effort = "max"), measured later on a 150-texture sample, about 0.6 s/Mpix; its Δ is against u6 on that sample.</text>
<text x="10.0" y="758.0" class="s" text-anchor="start">“~” times are approximate. Ranges are drawn as bars. NVTT Normal and texconv GPU share the 0.03–0.09 range.</text>
</svg>
