<text x="467.1" y="361.0" class="s" text-anchor="end">−0.69</text>
<text x="650.0" y="354.0" class="" text-anchor="start">0.11</text>
<text x="10.0" y="388.0" class="" text-anchor="start">NVTT Normal (GPU)</text>
<rect x="410.0" y="374.0" width="122.5" height="10" class="f2"/>
