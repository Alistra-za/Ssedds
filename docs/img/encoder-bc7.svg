<text x="10.0" y="20.0" class="t" text-anchor="start">BC7 encoders: speed against quality</text>
<text x="10.0" y="38.0" class="s" text-anchor="start">Left: speed, s per megapixel, log scale. Shorter bar = faster. Right: Δ dB against bc7e u6. Higher is better. Sorted by RGB. Bold = Tessalith default.</text>
<rect x="10" y="48" width="14" height="10" class="mu"/>
