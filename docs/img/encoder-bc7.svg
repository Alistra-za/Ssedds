<text x="396.2" y="225.0" class="s" text-anchor="end">−1.50</text>
<text x="650.0" y="218.0" class="" text-anchor="start">~33</text>
<text x="10.0" y="252.0" class="" text-anchor="start">NVTT Production/Highest</text>
<rect x="504.5" y="238.0" width="28.0" height="10" class="f2"/>
<text x="499.5" y="247.0" class="s" text-anchor="end">−0.32</text>
