<text x="495.1" y="259.0" class="s" text-anchor="end">−0.37</text>
<text x="650.0" y="252.0" class="" text-anchor="start">~14</text>
<text x="10.0" y="286.0" class="" text-anchor="start">bc7e u4</text>
<rect x="498.4" y="272.0" width="34.1" height="10" class="f0"/>
<text x="493.4" y="281.0" class="s" text-anchor="end">−0.39</text>
<rect x="501.0" y="284.0" width="31.5" height="10" class="f0 lt"/>
<text x="496.0" y="293.0" class="s" text-anchor="end">−0.36</text>
<text x="650.0" y="286.0" class="" text-anchor="start">0.12</text>
<text x="10.0" y="320.0" class="" text-anchor="start">ISPC slow</text>
<rect x="480.9" y="306.0" width="51.6" height="10" class="f1"/>
