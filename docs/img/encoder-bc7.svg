<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 536" width="780" height="536" role="img" aria-labelledby="t d">
<title id="t">BC7 encoders compared with bc7e u6</title>
<desc id="d">Horizontal bars of BC7 encoder quality against bc7e u6, in dB, sorted by RGB. Tessalith's opt-in bc7e max is best at +0.32 dB RGB and +0.32 dB alpha, about 0.6 s per megapixel. bc7e u5, the default, is level with u6 at 0.22 s. Slow encoders (NVTT Production about 14 s, Compressonator about 33 s, texconv CPU 16 to 20 s) do not beat it. GPU encoders are fastest, 0.03 to 0.09 s, but lose 1.4 to 2.8 dB.</desc>
<style>
svg{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
--ink:#1f2328;--mute:#59636e;--grid:#d1d9e0;--bg:#ffffff;--c0:#2a78d6;--c1:#eb6834;--c2:#1baf7a;--c3:#6250d6;--c4:#e87ba4;}
@media (prefers-color-scheme: dark){svg{--ink:#e6edf3;--mute:#9198a1;--grid:#30363d;--bg:#0d1117;--c0:#3987e5;--c1:#d95926;--c2:#199e70;--c3:#9085e9;--c4:#d55181;}}
.bg{fill:var(--bg)}
text{fill:var(--ink);font-size:12px;paint-order:stroke;stroke:var(--bg);stroke-width:4px;stroke-linejoin:round}
.m{fill:var(--mute)}
.b{font-weight:600}
.t{font-size:14px;font-weight:600}
.s{font-size:11px;fill:var(--mute)}
.g{stroke:var(--grid);stroke-width:1;fill:none}
.z{stroke:var(--mute);stroke-width:1;fill:none}
.lt{opacity:.5}
.mu{fill:var(--mute)}
.f0{fill:var(--c0)}.f1{fill:var(--c1)}.f2{fill:var(--c2)}.f3{fill:var(--c3)}.f4{fill:var(--c4)}</style>
<rect class="bg" width="780" height="536"/>
<text x="10.0" y="20.0" class="t" text-anchor="start">BC7 encoders: quality against bc7e u6, with speed</text>
<text x="10.0" y="38.0" class="s" text-anchor="start">Δ in dB against bc7e u6 (higher is better), sorted by RGB. Speed is in seconds per megapixel.</text>
<rect x="10" y="50" width="14" height="10" class="mu"/>
<text x="30.0" y="59.0" class="s" text-anchor="start">RGB, real colour textures</text>
<rect x="196" y="50" width="14" height="10" class="mu lt"/>
<text x="216.0" y="59.0" class="s" text-anchor="start">Alpha, real alpha textures</text>
<text x="650.0" y="82.0" class="s" text-anchor="start">Speed (s/Mpix)</text>
<path class="g" d="M270.0 96.0V470.0"/>
<text x="270.0" y="485.0" class="m" text-anchor="middle">−3</text>
<path class="g" d="M357.5 96.0V470.0"/>
<text x="357.5" y="485.0" class="m" text-anchor="middle">−2</text>
<path class="g" d="M445.0 96.0V470.0"/>
<text x="445.0" y="485.0" class="m" text-anchor="middle">−1</text>
<path class="g" d="M532.5 96.0V470.0"/>
<text x="532.5" y="485.0" class="m" text-anchor="middle">0</text>
<path class="z" d="M532.5 96.0V470.0"/>
<text x="10.0" y="116.0" class="b" text-anchor="start">bc7e max‡ (Tessalith opt-in)</text>
<rect x="532.5" y="102.0" width="28.0" height="10" class="f0"/>
<text x="565.5" y="111.0" class="s" text-anchor="start">+0.32</text>
<rect x="532.5" y="114.0" width="28.0" height="10" class="f0 lt"/>
<text x="565.5" y="123.0" class="s" text-anchor="start">+0.32</text>
<text x="650.0" y="116.0" class="" text-anchor="start">~0.6</text>
<text x="10.0" y="150.0" class="" text-anchor="start">bc7e u5 (Tessalith default)</text>
<rect x="532.5" y="136.0" width="0.9" height="10" class="f0"/>
<text x="538.4" y="145.0" class="s" text-anchor="start">+0.01</text>
