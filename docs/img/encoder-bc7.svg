<text x="10.0" y="526.0" class="s" text-anchor="start">‡ bc7e max is Tessalith's opt-in effort (encoder.effort = "max"). Measured later, on a 150-texture Skyrim sample; its Δ is against u6 on that sample.</text>
<text x="10.0" y="542.0" class="s" text-anchor="start">~ means approximate. Speed bars start at 0.01 s. A pale tail marks a range. The 0.03–0.09 s range is shared by NVTT Normal (GPU) and texconv GPU.</text>
</svg>
