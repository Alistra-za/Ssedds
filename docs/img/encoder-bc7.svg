<rect x="466.9" y="386.0" width="65.6" height="10" class="f2 lt"/>
<text x="461.9" y="395.0" class="s" text-anchor="end">−0.75</text>
<text x="650.0" y="388.0" class="" text-anchor="start">0.03–0.09</text>
<text x="10.0" y="422.0" class="" text-anchor="start">texconv CPU (-bc x)</text>
<rect x="392.5" y="408.0" width="140.0" height="10" class="f4"/>
<text x="387.5" y="417.0" class="s" text-anchor="end">−1.6</text>
<rect x="322.5" y="420.0" width="210.0" height="10" class="f4 lt"/>
<text x="317.5" y="429.0" class="s" text-anchor="end">−2.4</text>
<text x="650.0" y="422.0" class="" text-anchor="start">~16–20</text>
<text x="10.0" y="456.0" class="" text-anchor="start">texconv GPU</text>
<rect x="375.0" y="442.0" width="157.5" height="10" class="f4"/>
<text x="370.0" y="451.0" class="s" text-anchor="end">−1.8</text>
<rect x="287.5" y="454.0" width="245.0" height="10" class="f4 lt"/>
<text x="282.5" y="463.0" class="s" text-anchor="end">−2.8</text>
<text x="650.0" y="456.0" class="" text-anchor="start">0.03–0.09</text>
<text x="10.0" y="510.0" class="s" text-anchor="start">‡ bc7e max is Tessalith's opt-in effort (encoder.effort = "max"). Measured later, on a 150-texture Skyrim sample; its Δ is against u6 on that sample.</text>
<text x="10.0" y="526.0" class="s" text-anchor="start">~ means approximate. The 0.03–0.09 s range is shared by NVTT Normal (GPU) and texconv GPU.</text>
</svg>
