[workspace]
resolver = "2"
members = ["crates/encoders-sys", "crates/engine", "crates/cli", "crates/bench", "crates/gui", "crates/nif", "crates/vfs", "crates/modscan", "crates/render3d", "crates/pgpsim"]
exclude = ["spikes"]

[workspace.package]
version = "0.3.0"
edition = "2021"
license = "GPL-3.0-or-later"
publish = false
rust-version = "1.88"

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
schemars = "1"
image = { version = "0.25", default-features = false, features = ["png", "tga", "tiff", "exr", "hdr", "bmp", "jpeg"] }
half = "2"
bcdec_rs = "0.2"
rayon = "1"
sha2 = "0.10"
hex = "0.4"
globset = "0.4"
walkdir = "2"
tempfile = "3"
clap = { version = "4", features = ["derive"] }
ctrlc = "3"
humantime = "2"
cc = "1"
assert_cmd = "2"
predicates = "3"
encoders-sys = { path = "crates/encoders-sys" }
engine = { path = "crates/engine" }
encoding_rs = "0.8.42"
lz4_flex = { version = "0.14.0", default-features = false, features = ["frame", "std"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
crc32fast = "1.5.2"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

[profile.dev.package.encoders-sys]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
