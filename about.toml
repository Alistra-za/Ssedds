# cargo-about config for THIRD_PARTY_LICENSES.md (regenerate command: see THIRD_PARTY_NOTICES.md).
# Accepted = the licences actually present in the shipped dependency tree, all compatible with GPL-3.0-or-later.
# Order matters: for a crate offering a choice (SPDX OR) cargo-about picks the first accepted licence in this
# list, so MIT is preferred, then Apache-2.0, then the rest. Consequences in the current tree:
#   MIT OR Apache-2.0 (and variants with Zlib / BSD / Unlicense / 0BSD)  -> MIT
#   BSD-3-Clause OR Apache-2.0 (moxcms, pxfm)                             -> Apache-2.0
#   Apache-2.0 OR GPL-2.0-only (self_cell)                                -> Apache-2.0 (GPL-2.0-only is not
#       accepted: it is incompatible with GPL-3.0-or-later; Apache-2.0 is compatible with GPLv3)
#   AND expressions (dpi, encoding_rs, unicode-ident) list every licence that applies.
accepted = [
  "MIT",
  "Apache-2.0",
  "BSD-3-Clause",
  "BSD-2-Clause",
  "Zlib",
  "ISC",
  "BSL-1.0",
  "Unicode-3.0",
  "0BSD",
  "Unlicense",
]
targets = ["x86_64-pc-windows-msvc"]
ignore-dev-dependencies = true
ignore-build-dependencies = true
# Our own GPL-3.0-or-later crates (publish = false) are not third-party.
private = { ignore = true }
